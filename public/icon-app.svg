<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b5c" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#ff3b5c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#0a0a0a"/>

  <!-- Subtle glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#ff3b5c" stroke-width="28"/>

  <!-- Inner dot -->
  <circle cx="256" cy="256" r="38" fill="#ff3b5c"/>
</svg>
